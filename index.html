<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WizzyTheKid Charity Foundation</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
      background-color: #f5f5f5;
    }
    .page {
      display: none;
      padding: 40px 20px;
    }
    .active {
      display: block;
    }
    img {
      max-width: 90%;
      height: auto;
      border-radius: 10px;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    footer {
      margin-top: 40px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>

  <div id="page1" class="page active">
    <h1>Welcome to WizzyTheKid Charity Foundation</h1>
    <!-- <img src="https://cdn.pixabay.com/photo/2016/03/27/19/42/family-1280109_960_720.jpg" alt="Happy Family"> -->
    <img src="https://images.unsplash.com/photo-1503023345310-bd7c1de61c7d" alt="Happy Family">
    <br>
    <button onclick="nextPage(2)">Next</button>
  </div>

  <div id="page2" class="page">
    <h2>Claim your $10</h2>
    <button onclick="nextPage(3)">Claim</button>
  </div>

  <div id="page3" class="page">
    <h2>No go find side hustle do 😹</h2>
    <footer>Copyright © Wisdom Enang</footer>
  </div>

  <script>
    function nextPage(pageNumber) {
      const pages = document.querySelectorAll('.page');
      pages.forEach(page => page.classList.remove('active'));
      document.getElementById('page' + pageNumber).classList.add('active');
    }
  </script>

</body>
</html>
